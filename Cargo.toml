[workspace]
resolver = "3"
members = [
    "apps/rustnzb",
    "crates/mock-nntp-server",
    "crates/nzb-core",
    "crates/nzb-decode",
    "crates/nzb-decode/ffi",
    "crates/nzb-dispatch",
    "crates/nzb-news",
    "crates/nzb-nntp",
    "crates/nzb-postproc",
    "crates/nzb-web",
]
default-members = ["apps/rustnzb"]
exclude = ["benchnzb", "desktop"]

[workspace.package]
version = "1.7.1-beta.1"
edition = "2024"
rust-version = "1.99"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unused = "warn"

[workspace.lints.cargo]
unused_dependencies = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Web
axum = "0.8"
tower-http = { version = "0.7", features = ["compression-full", "cors", "trace"] }
utoipa = { version = "6", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
# Serialization
serde = { version = "1", features = ["derive"] }
# Content digests (duplicate NZB detection)
sha2 = "0.11"
serde_json = "1"
toml_edit = "0.25"
# TLS
rustls = { version = "0.23", features = ["ring"] }
# HTTP
http = "1"
reqwest = { version = "0.12", features = ["rustls-tls"] }
# Decode
crc32fast = "1"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender = "0.2"
# OpenTelemetry
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "metrics"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "metrics", "logs", "trace"] }
tracing-opentelemetry = "0.33"
opentelemetry-appender-tracing = "0.32"
# Error handling
anyhow = "1"
# Util
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
arc-swap = "1"
hex = "0.4"
base64 = "0.23"
# XML
regex = "1"
tar = "0.4"
flate2 = "1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
bzip2 = "0.6"

# Shared NZB crates
nzb-web = { version = "0.4.26", path = "crates/nzb-web", features = ["groups-db"] }
nzb-nntp = { version = "0.2.27", path = "crates/nzb-nntp" }
nzb-decode = { version = "0.1.9", path = "crates/nzb-decode" }
mock-nntp-server = { version = "0.1.0", path = "crates/mock-nntp-server" }
rust-par2 = { version = "0.2.0" }
md-5 = "0.11"
yenc-simd = { version = "0.1.1" }

[patch.crates-io]
nzb-web = { path = "crates/nzb-web" }
nzb-dispatch = { path = "crates/nzb-dispatch" }
nzb-nntp = { path = "crates/nzb-nntp" }
nzb-news = { path = "crates/nzb-news" }
nzb-core = { path = "crates/nzb-core" }
nzb-postproc = { path = "crates/nzb-postproc" }
nzb-decode = { path = "crates/nzb-decode" }

# Argon2 is deliberately expensive; unoptimised it makes every test login take
# about a second. Optimise just the hashing crates in dev and test builds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
