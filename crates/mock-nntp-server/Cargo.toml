[package]
name = "mock-nntp-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Scriptable mock NNTP server with yEnc and PAR2 fixtures, for testing Usenet download clients"
license = "MIT"
repository = "https://github.com/TheDancingDeveloper-org/mock-nntp-server"
publish = true

[dependencies]
anyhow = { workspace = true }
nzb-nntp = { workspace = true, features = ["test-support"] }
tokio = { workspace = true }
yenc-simd = { workspace = true }
clap = { version = "4", features = ["derive"] }
# PAR2 fixtures: packet MD5s, IFSC CRC32s, and the recovery-slice encoder.
md-5 = "0.11"
crc32fast = { workspace = true }
rust-par2 = { workspace = true }

[dev-dependencies]
tempfile = "3"
