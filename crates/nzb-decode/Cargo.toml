[package]
name = "nzb-decode"
version = "0.1.9"
edition = "2024"
rust-version.workspace = true
description = "yEnc decoding, file assembly, and article cache for NZB download clients"
license = "MIT"
repository = "https://github.com/TheDancingDeveloper-org/nzb-decode"
readme = "README.md"

[dependencies]
crc32fast = "1"
md-5 = "0.11"
yenc-simd = "0.1"
tracing = "0.1"
thiserror = "2"
parking_lot = "0.12"
rust-par2 = { workspace = true }

[features]
default = []
test-support = []

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints]
workspace = true
