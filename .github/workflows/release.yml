name: Release delivery

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: rustnzb-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-ref:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a version tag reachable from protected main
        run: |
          test "${GITHUB_REF_TYPE}" = tag
          case "${GITHUB_REF_NAME}" in v[0-9]*) ;; *) exit 1 ;; esac
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Require the tag to match the workspace version
        run: ci/check-version.sh "${GITHUB_REF_NAME}"

  codeql:
    # Static analysis for the release being cut; it does not gate the build.
    needs: verify-release-ref
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/codeql.yml

  release-image:
    needs: verify-release-ref
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing uses this job's GitHub OIDC token; no key is stored.
      id-token: write
    runs-on: [self-hosted, docker, publish]
    env:
      IMAGE: ghcr.io/thedancingdeveloper-org/rustnzbd
    steps:
      - uses: actions/checkout@v7
      # A pre-release tag (v1.2.3-beta.N / -alpha / -rc) publishes the moving
      # `:beta` channel and never touches `:latest`, so it can soak before a
      # stable promotion (see promote-release.yml). A plain vX.Y.Z tag is the
      # stable channel and moves `:latest` as before.
      - name: Determine release channel
        id: channel
        run: |
          case "${GITHUB_REF_NAME}" in
            *-alpha*|*-beta*|*-rc*) moving=beta ;;
            *) moving=latest ;;
          esac
          echo "moving=$moving" >> "$GITHUB_OUTPUT"
          if [ "$moving" = beta ]; then
            echo "pre-release channel: moving tag :beta (:latest left untouched)"
          else
            echo "stable channel: moving tag :latest"
          fi
      # Authenticate to Docker Hub first -- setup-qemu-action pulls its
      # binfmt image from Docker Hub too, and doing that unauthenticated
      # hits the shared runner's unauthenticated pull rate limit.
      - name: Authenticate to Docker Hub (higher pull rate limit for base images)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Stamp the build time for the OCI created label
        id: stamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: repo.indexarr.net
          username: x-access-token
          password: ${{ secrets.FORGEJO_CARGO_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build and publish multi-architecture release image once
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          # Build provenance (mode=max) and an SBOM are attached to the image
          # index as attestation manifests, so they travel with the digest.
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:${{ steps.channel.outputs.moving }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            RUSTNZB_BUILD_REF=${{ github.ref_name }}
            RUSTNZB_BUILD_CREATED=${{ steps.stamp.outputs.created }}
            RELEASE_OPTIMIZED=true
          cache-from: ''
          cache-to: ''
      - name: Smoke-test the exact amd64 release image
        run: ci/tasks/smoke-runtime "$IMAGE:${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}"
      # GitHub exposes container visibility through package settings, not the
      # REST API. Keep this fail-closed check so a release cannot complete until
      # an organization owner has made the end-user package public once.
      - name: Verify anonymous amd64 and arm64 manifests
        run: |
          token=$(curl -fsS 'https://ghcr.io/token?service=ghcr.io&scope=repository:thedancingdeveloper-org/rustnzbd:pull' | jq -r .token)
          test -n "$token"
          curl -fsS -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "$IMAGE_MANIFEST" > manifest.json
          jq -e '.manifests | map(.platform.architecture) | index("amd64") != null' manifest.json
          jq -e '.manifests | map(.platform.architecture) | index("arm64") != null' manifest.json
        env:
          IMAGE_MANIFEST: https://ghcr.io/v2/thedancingdeveloper-org/rustnzbd/manifests/${{ github.ref_name }}
      - uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.1
      - name: Sign the release image digest (keyless, recorded in Rekor)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Copy the same release manifest to the Forgejo rollback registry
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_CARGO_TOKEN }}
          MOVING_TAG: ${{ steps.channel.outputs.moving }}
          SKOPEO_IMAGE: quay.io/skopeo/stable:v1.19@sha256:77e6c8901f6976bdfa87b8b14c40b96de754794c492d8ed295f77fba1454a4ab
        run: |
          docker run --rm --entrypoint sh \
            -e GH_TOKEN -e FORGEJO_TOKEN -e GITHUB_ACTOR -e GITHUB_REF_NAME -e MOVING_TAG \
            "$SKOPEO_IMAGE" -ec '
              src="docker://ghcr.io/thedancingdeveloper-org/rustnzbd:$GITHUB_REF_NAME"
              dst="docker://repo.indexarr.net/indexarr/rustnzbd:$GITHUB_REF_NAME"
              skopeo copy --multi-arch all \
                --src-creds "$GITHUB_ACTOR:$GH_TOKEN" \
                --dest-creds "$FORGEJO_TOKEN:$FORGEJO_TOKEN" "$src" "$dst"
              skopeo copy --multi-arch all \
                --src-creds "$GITHUB_ACTOR:$GH_TOKEN" \
                --dest-creds "$FORGEJO_TOKEN:$FORGEJO_TOKEN" "$src" \
                "docker://repo.indexarr.net/indexarr/rustnzbd:$MOVING_TAG"
              src_digest=$(skopeo inspect --creds "$GITHUB_ACTOR:$GH_TOKEN" --format "{{.Digest}}" "$src")
              dst_digest=$(skopeo inspect --creds "$FORGEJO_TOKEN:$FORGEJO_TOKEN" --format "{{.Digest}}" "$dst")
              test "$src_digest" = "$dst_digest"
              printf "Verified identical GHCR/Forgejo release digest %s\n" "$src_digest"
            '
      - name: Copy the same release manifest to the old public GHCR namespace
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OLD_GHCR_TOKEN: ${{ secrets.OLD_GHCR_TOKEN }}
          MOVING_TAG: ${{ steps.channel.outputs.moving }}
          SKOPEO_IMAGE: quay.io/skopeo/stable:v1.19@sha256:77e6c8901f6976bdfa87b8b14c40b96de754794c492d8ed295f77fba1454a4ab
        run: |
          docker run --rm --entrypoint sh \
            -e GH_TOKEN -e OLD_GHCR_TOKEN -e GITHUB_ACTOR -e GITHUB_REF_NAME -e MOVING_TAG \
            "$SKOPEO_IMAGE" -ec '
              src="docker://ghcr.io/thedancingdeveloper-org/rustnzbd:$GITHUB_REF_NAME"
              dst="docker://ghcr.io/ausagentsmith-org/rustnzb:$GITHUB_REF_NAME"
              skopeo copy --multi-arch all \
                --src-creds "$GITHUB_ACTOR:$GH_TOKEN" \
                --dest-creds "AusAgentSmith:$OLD_GHCR_TOKEN" "$src" "$dst"
              skopeo copy --multi-arch all \
                --src-creds "$GITHUB_ACTOR:$GH_TOKEN" \
                --dest-creds "AusAgentSmith:$OLD_GHCR_TOKEN" "$src" \
                "docker://ghcr.io/ausagentsmith-org/rustnzb:$MOVING_TAG"
              src_digest=$(skopeo inspect --creds "$GITHUB_ACTOR:$GH_TOKEN" --format "{{.Digest}}" "$src")
              dst_digest=$(skopeo inspect --creds "AusAgentSmith:$OLD_GHCR_TOKEN" --format "{{.Digest}}" "$dst")
              test "$src_digest" = "$dst_digest"
              printf "Verified identical new/old GHCR release digest %s\n" "$src_digest"
            '

  release-assets:
    needs: verify-release-ref
    permissions:
      contents: write
      # Keyless signing and build-provenance / SBOM attestations use this job's OIDC token.
      id-token: write
      attestations: write
    runs-on: [self-hosted, docker, publish]
    env:
      # Keep in step with `.github/workflows/release-dry-run.yml`, which mirrors
      # this build without publishing.
      CROSS_IMAGE: repo.indexarr.net/indexarr/rustnzb-ci-cross@sha256:d747454fca94ebfd9dba1f566d9f549c4c9fbedf785c6aba36a0c383d9b9a955
    steps:
      - uses: actions/checkout@v7
      - name: Build Linux, arm64, Windows, and package artifacts
        env:
          GIT_AUTH_TOKEN: ${{ secrets.FORGEJO_CARGO_TOKEN }}
        run: |
          printf '%s' "$GIT_AUTH_TOKEN" | docker login repo.indexarr.net --username x-access-token --password-stdin >/dev/null
          container="rustnzb-release-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker create --name "$container" -w /workspace \
            -e GIT_AUTH_TOKEN -e CI_COMMIT_SHA="$GITHUB_SHA" \
            -e CI_COMMIT_TAG="$GITHUB_REF_NAME" -e CI_PIPELINE_NUMBER="$GITHUB_RUN_ID" \
            "$CROSS_IMAGE" sh -ec '
              ci/tasks/frontend-build
              ci/tasks/build-linux
              ci/tasks/build-linux-arm64
              ci/tasks/build-windows
              ci/tasks/package-release
            ' >/dev/null
          docker cp . "$container:/workspace"
          docker start -a "$container"
          mkdir -p .ci-output/packages
          docker cp "$container:/workspace/.ci-output/packages/." .ci-output/packages/
          (cd .ci-output/packages && sha256sum -c "SHA256SUMS-${GITHUB_REF_NAME}.txt")
      # AppImages wrap the Linux binaries that were just built and verified; the
      # binary inside is byte-identical to the tarball's. The checksum file is
      # rewritten so it covers them, before it is signed below.
      - name: Build Linux AppImages from the release tarballs
        run: |
          set -eu
          packaging/appimage/build-appimage.sh "${GITHUB_REF_NAME}" --assets-dir .ci-output/packages
          (cd .ci-output/packages && sha256sum rustnzb-* >"SHA256SUMS-${GITHUB_REF_NAME}.txt" \
            && sha256sum -c "SHA256SUMS-${GITHUB_REF_NAME}.txt")
      # The shipped binaries must carry cargo-auditable's `.dep-v0` section, or
      # syft falls back to guessing and the SBOM is not dependency-accurate.
      - name: Verify the audit section reached the shipped binaries
        run: |
          set -eu
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          for arch in x86_64 aarch64; do
            tar -xzf ".ci-output/packages/rustnzb-${GITHUB_REF_NAME}-linux-${arch}.tar.gz" \
              -C "$work" "rustnzb-${GITHUB_REF_NAME}/rustnzb"
            objdump -h "$work/rustnzb-${GITHUB_REF_NAME}/rustnzb" | grep -q '\.dep-v0'
            printf 'audit: linux-%s carries .dep-v0\n' "$arch"
          done
      - uses: sigstore/cosign-installer@v3.7.0
        with:
          cosign-release: v2.4.1
      - name: Sign SHA256SUMS (keyless) so the checksum file has a verifiable origin
        working-directory: .ci-output/packages
        run: |
          cosign sign-blob --yes \
            --output-signature "SHA256SUMS-${GITHUB_REF_NAME}.sig" \
            --output-certificate "SHA256SUMS-${GITHUB_REF_NAME}.pem" \
            "SHA256SUMS-${GITHUB_REF_NAME}.txt"
      # One SPDX SBOM per release artefact, generated by syft from the file
      # that is shipped. The SBOMs are uploaded with the release assets.
      - uses: anchore/sbom-action/download-syft@v0.17.9
        with:
          syft-version: v1.18.1
      - name: Generate per-artefact SBOMs (SPDX JSON)
        working-directory: .ci-output/packages
        run: |
          for file in rustnzb-*; do
            case "$file" in *.spdx.json) continue ;; esac
            syft "$file" -o "spdx-json=${file}.spdx.json"
          done
      # Package-manager manifests, rendered from the release's own checksum file
      # that was produced above. This is a dry run: the files are uploaded as a
      # workflow artefact for the operator to review and submit. Nothing is
      # published to Homebrew, Scoop or winget from CI.
      - name: Render Scoop and winget manifests (dry run, upload only)
        run: |
          set -eu
          mkdir -p .ci-output/manifests
          packaging/distribution/render-windows-manifests.sh \
            "${GITHUB_REF_NAME}" \
            --sums ".ci-output/packages/SHA256SUMS-${GITHUB_REF_NAME}.txt" \
            --assets-dir .ci-output/packages \
            --release-date "$(date -u +%Y-%m-%d)" \
            --out .ci-output/manifests
      - uses: actions/upload-artifact@v4
        with:
          name: rustnzb-${{ github.ref_name }}-distribution-manifests
          path: .ci-output/manifests/packaging/**
          if-no-files-found: error
          retention-days: 30
      # Build provenance (who built what, from which commit and workflow) for
      # every binary package, plus the signed checksum file.
      - name: Attest build provenance for the release artefacts
        uses: actions/attest-build-provenance@v2.2.3
        with:
          subject-path: |
            .ci-output/packages/rustnzb-${{ github.ref_name }}-linux-x86_64.tar.gz
            .ci-output/packages/rustnzb-${{ github.ref_name }}-linux-aarch64.tar.gz
            .ci-output/packages/rustnzb-${{ github.ref_name }}-amd64.deb
            .ci-output/packages/rustnzb-${{ github.ref_name }}-arm64.deb
            .ci-output/packages/rustnzb-${{ github.ref_name }}-windows-x86_64-setup.exe
            .ci-output/packages/rustnzb-${{ github.ref_name }}-x86_64.AppImage
            .ci-output/packages/rustnzb-${{ github.ref_name }}-aarch64.AppImage
            .ci-output/packages/SHA256SUMS-${{ github.ref_name }}.txt
      - name: Attest SBOM for linux-x86_64.tar.gz
        uses: actions/attest-sbom@v2.2.0
        with:
          subject-path: .ci-output/packages/rustnzb-${{ github.ref_name }}-linux-x86_64.tar.gz
          sbom-path: .ci-output/packages/rustnzb-${{ github.ref_name }}-linux-x86_64.tar.gz.spdx.json
      - name: Attest SBOM for linux-aarch64.tar.gz
        uses: actions/attest-sbom@v2.2.0
        with:
          subject-path: .ci-output/packages/rustnzb-${{ github.ref_name }}-linux-aarch64.tar.gz
          sbom-path: .ci-output/packages/rustnzb-${{ github.ref_name }}-linux-aarch64.tar.gz.spdx.json
      - name: Attest SBOM for amd64.deb
        uses: actions/attest-sbom@v2.2.0
        with:
          subject-path: .ci-output/packages/rustnzb-${{ github.ref_name }}-amd64.deb
          sbom-path: .ci-output/packages/rustnzb-${{ github.ref_name }}-amd64.deb.spdx.json
      - name: Attest SBOM for arm64.deb
        uses: actions/attest-sbom@v2.2.0
        with:
          subject-path: .ci-output/packages/rustnzb-${{ github.ref_name }}-arm64.deb
          sbom-path: .ci-output/packages/rustnzb-${{ github.ref_name }}-arm64.deb.spdx.json
      - name: Attest SBOM for windows-x86_64-setup.exe
        uses: actions/attest-sbom@v2.2.0
        with:
          subject-path: .ci-output/packages/rustnzb-${{ github.ref_name }}-windows-x86_64-setup.exe
          sbom-path: .ci-output/packages/rustnzb-${{ github.ref_name }}-windows-x86_64-setup.exe.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: rustnzb-${{ github.ref_name }}-release-assets
          path: .ci-output/packages/*
          if-no-files-found: error
          retention-days: 30
      - name: Create or update the GitHub release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          prerelease=false
          case "$GITHUB_REF_NAME" in *alpha*|*beta*|*rc*) prerelease=true ;; esac
          release_id=$(curl -fsS "${auth[@]}" "$api/releases/tags/$GITHUB_REF_NAME" | jq -r .id 2>/dev/null || true)
          if [ -z "$release_id" ] || [ "$release_id" = null ]; then
            payload=$(jq -nc --arg tag "$GITHUB_REF_NAME" --argjson pre "$prerelease" \
              '{tag_name:$tag,name:("rustnzb "+$tag),draft:false,prerelease:$pre,generate_release_notes:true}')
            release_id=$(curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/json' \
              --data "$payload" "$api/releases" | jq -r .id)
          fi
          test -n "$release_id"
          for file in .ci-output/packages/rustnzb-* .ci-output/packages/SHA256SUMS-*; do
            name=$(basename "$file")
            old_id=$(curl -fsS "${auth[@]}" "$api/releases/$release_id/assets?per_page=100" \
              | jq -r --arg name "$name" '.[] | select(.name==$name) | .id' | head -n1)
            if [ -n "$old_id" ]; then
              curl -fsS -X DELETE "${auth[@]}" "$api/releases/assets/$old_id" >/dev/null
            fi
            curl -fsS -X POST "${auth[@]}" -H 'Content-Type: application/octet-stream' \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$release_id/assets?name=$name" >/dev/null
          done

  # macOS dmg: dry run, off by default. There is no macOS release binary and no
  # macOS runner in the pool yet, so this job only runs when the repository
  # variable RUSTNZB_MACOS_DMG is 'true' and a [self-hosted, macos] runner is
  # online. It builds the binary on the runner, wraps it with
  # packaging/macos/build-dmg.sh and uploads the dmg as a workflow artefact; it
  # is not attached to the release. The dmg is unsigned and not notarised (no
  # code signing, by decision), so nothing here needs an Apple identity.
  macos-dmg:
    needs: verify-release-ref
    if: vars.RUSTNZB_MACOS_DMG == 'true'
    runs-on: [self-hosted, macos]
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Build the macOS binary and the unsigned dmg
        run: |
          set -eu
          ci/tasks/frontend-build
          rustup target add "${{ matrix.target }}"
          cargo build --release -p rustnzb --features webdav --locked --target "${{ matrix.target }}"
          packaging/macos/build-dmg.sh "${GITHUB_REF_NAME}" \
            --binary "target/${{ matrix.target }}/release/rustnzb" \
            --arch "${{ matrix.arch }}" --out .ci-output/dmg
          (cd .ci-output/dmg && shasum -a 256 rustnzb-*.dmg >"SHA256SUMS-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: rustnzb-${{ github.ref_name }}-macos-${{ matrix.arch }}-dmg
          path: .ci-output/dmg/*
          if-no-files-found: error
          retention-days: 30
