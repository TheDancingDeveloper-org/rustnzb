name: CodeQL

# Static analysis (code scanning) for the Rust workspace and the Angular
# frontend. Findings surface under the repository's Security > Code scanning
# tab and as PR annotations.
#
# Runners: matches the rest of CI on the self-hosted fleet so the runner-policy
# gate passes. Both languages use buildless extraction (build-mode: none), so
# no compiler/toolchain step is needed; a single label set covers both.

on:
  push:
    branches: [main]
  # A PR analyses only the languages its diff touches; the other language's
  # required `Analyze (...)` context still posts, with its steps skipped. The
  # merge queue, main and the weekly schedule analyse everything.
  pull_request:
  merge_group:
  schedule:
    # Weekly, so advisories that appear after a quiet period are still caught.
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Dependabot PRs change dependency metadata only; skip to avoid spending a
    # self-hosted runner on each. Skipped jobs report success, so a required
    # check would not stay pending.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot'
    runs-on: [self-hosted]
    permissions:
      # Uploading CodeQL results requires write on security events.
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust CodeQL only supports buildless extraction (build-mode: none);
          # it does not support autobuild.
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Classify changes
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" != pull_request ]]; then echo "run=true" >>"$GITHUB_OUTPUT"; exit 0; fi
          case "$LANGUAGE" in
            rust) pattern='(\.rs$|(^|/)Cargo\.(toml|lock)$)' ;;
            *) pattern='(\.(ts|tsx|js|mjs|cjs|html)$|(^|/)package(-lock)?\.json$)' ;;
          esac
          files="$(git diff --name-only "$(git merge-base "$BASE_SHA" HEAD)" HEAD)"
          if grep -Eq "$pattern|^\.github/(workflows/codeql\.yml|codeql/)" <<<"$files"; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "No $LANGUAGE changes; analysis skipped (the queue analyses everything)."
          fi

      # TypeScript extraction needs `node` on PATH; not every self-hosted
      # runner has it, so install it rather than depend on runner placement.
      - name: Set up Node.js
        if: steps.scope.outputs.run == 'true' && matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Initialize CodeQL
        if: steps.scope.outputs.run == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Broader coverage than the default suite. security-extended adds
          # lower-precision security queries (more findings, some noisier);
          # triage new alerts under Security > Code scanning.
          queries: security-extended
          # paths-ignore etc. (e.g. the benchnzb benchmark harness).
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        if: steps.scope.outputs.run == 'true'
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
