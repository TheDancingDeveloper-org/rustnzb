name: Scheduled test quality

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - name: Install Rust coverage tooling
        run: cargo install cargo-llvm-cov --locked
      - name: Enforce non-decreasing Rust coverage
        run: ci/tasks/rust-coverage
      - uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: .ci-artifacts/rust-coverage.json

  fuzz:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly
      - name: Install fuzzing tooling
        # rust-toolchain.toml pins the MSRV here; cargo-fuzz's locked deps
        # need a newer rustc, so install with the nightly the job uses.
        run: cargo +nightly install cargo-fuzz --locked
      - name: Run bounded fuzz targets
        working-directory: fuzz
        run: |
          for target in nzb_xml yenc nntp_response sab_api; do
            cargo +nightly fuzz run "$target" -- -max_total_time=60
          done
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  mutation:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Install mutation tooling
        run: cargo install cargo-mutants --locked
      - name: Mutation-test parser and decoder crates
        # cargo-mutants creates --output itself but not its parents.
        run: |
          mkdir -p .ci-artifacts
          cargo mutants --package nzb-core --package nzb-decode --timeout 60 --output .ci-artifacts/mutants
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: .ci-artifacts/mutants

  crate-drift:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
      - name: Diff the standalone nzb-* repos against the monorepo head
        run: ci/tasks/crate-drift
        env:
          # Optional: a token that can read the standalone repos if any are
          # private. Public repos clone anonymously and this stays empty.
          GH_TOKEN: ${{ secrets.NZB_SYNC_TOKEN }}
