[general]
listen_addr = "0.0.0.0"
port = 9090
# api_key = "your-secret-api-key-here"
# Accepted by the native API and the SABnzbd-compatible API as an
# `X-Api-Key` header, which keeps it out of URLs and access logs. The
# SABnzbd-compatible API also takes `apikey` in the query string or body.
incomplete_dir = "/downloads/incomplete"
complete_dir = "/downloads/complete"
data_dir = "/data"
speed_limit_bps = 0  # 0 = unlimited
cache_size = 524288000  # 500 MB; the API accepts 16 MiB to 64 GiB
# Log level: trace, debug, info, warn, error, or off. A full filter such as
# "info,nzb_nntp=debug" is also accepted. Precedence, highest first:
#   RUST_LOG env (full filter override) > --log-level CLI flag >
#   RUSTNZB_LOG_LEVEL env > this setting > "info".
# An invalid value logs a warning and falls back to "info". Applied at start.
log_level = "info"
# max_active_downloads = 1  # 0 = unlimited; the API accepts at most 100
# Also write logs to this file, in addition to stdout. The file rotates daily
# as <name>.YYYY-MM-DD and the newest 7 are kept. --log-file / RUSTNZB_LOG_FILE
# override this setting. Applied at start.
# log_file = "data/rustnzb.log"
# history_retention = 100  # Number of NZBs to keep in history (omit or 0 = keep all)
max_active_downloads = 1  # NZBs downloading simultaneously (0 = unlimited)
# auto_sort_remaining_pct = false  # Keep queued items ordered by remaining work
# duplicate_policy = "warn"  # allow | warn | skip: an NZB matching a queued or history job by name or content
# rss_downloaded_item_expiry_days = 30  # Remove downloaded RSS records after this many days
# Independent post-processing jobs overlap downloads. Separate repair and
# extraction gates allow those stages to overlap safely across different jobs.
# These limits are applied at process start. The API accepts 0..=64 per
# limit (0 is raised to 1).
max_post_processing_jobs = 2
max_repair_workers = 1
max_extract_workers = 1
direct_unpack = true  # Extract RAR volumes while downloading when unrar is available
max_nested_archive_depth = 5  # 0=outer archive only; protects against unbounded nesting (API: 0-10)
# The download-health settings below are applied at process start.
# abort_hopeless = true          # edited via /api/config/disk-guards
# early_failure_check = true     # abort dead NZBs after the first articles
# required_completion_pct = 100.2  # 100.0-200.0; >100 reserves a PAR2 repair margin
# article_timeout_secs = 30      # 0 = no timeout; the API accepts at most 3600
# Post-processing hooks run without a shell, with a bounded timeout and output capture.
# They get SABnzbd's positional arguments (final dir, NZB name, job name, report,
# category, group, status code 0-3, URL) plus SAB_* and NZBPP_* environment variables.
# SABnzbd's change_complete_action can name a script_<name> from scripts_dir to run
# once the queue drains; power actions are refused.
# queue_complete_pers = false    # keep change_complete_action after it runs once (SABnzbd default: reset)
# SABnzbd addlocalfile reads NZBs only from this directory, and only with an API key set.
# local_import_dir = "/data/nzb-import"
# scripts_dir = "/data/scripts"
# script_success = "on-success.sh"
# script_failure = "on-failure.sh"
script_timeout_secs = 300
script_max_output_bytes = 1048576
# Server-side URL fetches (add-url, SABnzbd addurl, RSS feeds) refuse private
# and reserved addresses by default. To reach a self-hosted indexer such as
# NZBHydra2 or Prowlarr on your LAN or a Docker network, either allow private
# ranges wholesale or list the specific hosts/CIDRs. Loopback and link-local
# addresses (127.0.0.1, ::1, the 169.254.169.254 cloud-metadata endpoint) stay
# blocked unless listed in fetch_allowed_hosts.
# fetch_allow_private = false
# fetch_allowed_hosts = ["prowlarr", "192.168.1.0/24", "172.16.0.0/12"]

# Most headers kept per group when fetching (oldest pruned first). 0 keeps all.
# group_max_headers = 100000

# Seconds to wait for open HTTP connections and queue shutdown on SIGINT/SIGTERM
# before exiting anyway. 0 waits forever.
# shutdown_timeout_secs = 30

# NNTP servers — add as many as needed, ordered by priority
# Use the web UI "Servers" tab to add/edit servers, or uncomment below.
# Only `host` is required. Omitted fields default to: port 563, ssl = true,
# ssl_verify = true, connections 8, priority 0, enabled = true, retention 0
# (unlimited), optional = false, pipelining 4. A missing `id` is derived
# from host and port.
#
# [[servers]]
# id = "primary"
# name = "My Primary Server"
# host = "news.example.com"
# port = 563
# ssl = true
# ssl_verify = true
# username = "user"
# password = "pass"
# connections = 8
# priority = 0  # 0 = highest priority
# enabled = true
# retention = 3000  # days
# pipelining = 4
# optional = false
# ramp_up_delay_ms = 50
#
# [[servers]]
# id = "backup"
# name = "Backup Server"
# host = "backup.example.com"
# port = 563
# ssl = true
# ssl_verify = true
# username = "user2"
# password = "pass2"
# connections = 4
# priority = 1
# enabled = true
# retention = 1000
# pipelining = 4
# optional = true

# Download categories
[[categories]]
name = "Default"
post_processing = 3  # 0=none, 1=repair, 2=unpack, 3=repair+unpack

[[categories]]
name = "movies"
output_dir = "movies"
post_processing = 3
# cleanup_patterns = ["*.nfo", "sample/*"]
# unwanted_extensions = [".sfv", ".jpg"]

[[categories]]
name = "tv"
output_dir = "tv"
post_processing = 3

[[categories]]
name = "software"
output_dir = "software"
post_processing = 2

# OpenTelemetry (can also be set via env vars).
# `enabled` / `endpoint` remain as shared fallbacks for older configs.
# Prefer the per-signal toggles and endpoints below so logs and metrics can
# be routed independently.
# If your platform already scrapes container stdout into Loki, leave
# `logs_enabled = false` to avoid duplicate log ingestion.
[otel]
enabled = false
endpoint = "http://localhost:4317"  # Shared fallback OTLP gRPC endpoint
logs_enabled = false
logs_endpoint = "http://localhost:4317"
metrics_enabled = false
metrics_endpoint = "http://localhost:4317"
service_name = "rustnzb"

# PAR2 recovery volumes are held until the in-flight slice map shows damage,
# then only enough volumes to cover it (plus a margin) are fetched. Set
# false to fetch every volume up front.
# trust_inflight_verify accepts a PAR2 set as verified from the in-flight
# slice map when it covers every file; set false to always verify from disk.
[par2]
defer_volumes = true
trust_inflight_verify = true

[dav]
enabled = false
auto_send_all = false
# category_rules = ["movies", "tv"]
# username = "plex"
# password = "change-me"
# api_key = "optional-api-key"

# Notifications for completed, failed and disk-full events. Each target is
# off until its URL or topic is set. Changes take effect after a restart.
# Put secrets (URLs with tokens, ntfy_token) in a private config file only.
[notifications]
# Generic webhook: POSTs a JSON document per event.
# webhook_url = "https://example.invalid/rustnzb-hook"
# Apprise API: notify endpoint of an Apprise API server. Set apprise_urls to
# send to Apprise URLs directly, or leave it empty when the endpoint carries
# a configuration key.
# apprise_api_url = "http://apprise:8000/notify"
# apprise_urls = "discord://webhook_id/webhook_token"
# ntfy: publishes to a topic on an ntfy server.
# ntfy_server = "https://ntfy.sh"
# ntfy_topic = "rustnzb-alerts"
# ntfy_token = ""
